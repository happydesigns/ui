minimumReleaseAgeExclude:
  - nuxt@4.5.0
  - '@nuxt/kit@4.5.0'
  - '@nuxt/nitro-server@4.5.0'
  - '@nuxt/schema@4.5.0'
  - '@nuxt/vite-builder@4.5.0'

shellEmulator: true

trustPolicy: no-downgrade
packages:
  - ./
  - playground

overrides:
  semver@6: 6.3.0

allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  better-sqlite3: true
  esbuild: true
  rollup: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
