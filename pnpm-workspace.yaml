minimumReleaseAgeExclude:
  - nuxt@4.6.1
  - '@nuxt/kit@4.6.1'
  - '@nuxt/nitro-server@4.6.1'
  - '@nuxt/schema@4.6.1'
  - '@nuxt/vite-builder@4.6.1'
  # Owner-approved Content 3.17.0 and the fresh minimum versions it requires.
  - '@nuxt/content@3.17.0'
  - '@nuxtjs/mdc@0.23.4'
  - isomorphic-git@1.44.16
  - minimatch@11.0.9
  - '@happydesigns/config-variants@0.3.0'

shellEmulator: true

trustPolicy: no-downgrade
# Reviewed, owner-approved versions: npm provenance and tarball hashes match
# the official CSS build repositories after their publishing-process change.
trustPolicyExclude:
  - browserslist@4.29.3
  - cssnano-preset-default@9.8.0
  - cssnano-utils@9.0.0
  - cssnano@9.8.0
  - postcss-calc@11.2.3
  - postcss-colormin@9.0.8
  - postcss-convert-values@9.1.0
  - postcss-discard-comments@9.0.8
  - postcss-discard-duplicates@9.0.7
  - postcss-discard-empty@9.0.8
  - postcss-discard-overridden@9.0.6
  - postcss-merge-longhand@9.4.0
  - postcss-merge-rules@9.1.5
  - postcss-minify-font-values@9.0.9
  - postcss-minify-gradients@9.0.8
  - postcss-minify-params@9.1.0
  - postcss-minify-selectors@9.0.8
  - postcss-normalize-charset@9.0.6
  - postcss-normalize-display-values@9.0.7
  - postcss-normalize-positions@9.0.8
  - postcss-normalize-repeat-style@9.0.7
  - postcss-normalize-string@9.0.7
  - postcss-normalize-timing-functions@9.0.7
  - postcss-normalize-unicode@9.1.1
  - postcss-normalize-url@10.0.0
  - postcss-normalize-whitespace@9.0.8
  - postcss-ordered-values@9.0.9
  - postcss-reduce-initial@9.0.7
  - postcss-reduce-transforms@9.0.6
  - postcss-unique-selectors@9.0.6
  - stylehacks@9.0.8
packages:
  - ./
  - playground

overrides:
  # Docus stays pinned; this OG patch uses Nuxt's current island-hash implementation.
  docus@5.12.3>nuxt-og-image: 6.10.4
  semver@6: 6.3.0

allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  better-sqlite3: true
  esbuild: true
  rollup: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
